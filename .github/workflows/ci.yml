name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint target"
      - name: Type check
        run: npm run type-check 2>/dev/null || echo "No type-check target"
      - name: Build
        run: npm run build
