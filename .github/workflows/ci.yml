name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # registry:check compares issues.json with main
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm registry:check origin/${{ github.base_ref }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm proto:build # the design archive must keep building
      - name: Judges (local build)
        run: pnpm judges
      - name: Judge report
        if: always()
        run: cat .judges/local.md >> "$GITHUB_STEP_SUMMARY" || true
