name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'
  SITE: https://blog.dr4w.io

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://blog.dr4w.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

      - name: wrangler deploy (static assets + custom domain blog.dr4w.io)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Wait for the custom domain (the first deploy issues a certificate)
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/" || true)
            [ "$code" = 200 ] && exit 0
            echo "attempt $i: $code"; sleep 5
          done
          exit 1

      - name: Judges against production
        run: pnpm judges --live "$SITE"

      - name: Judge report
        if: always()
        run: cat .judges/live.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Tell dr4w.io to rebuild its Writing section
        env:
          GH_TOKEN: ${{ secrets.LANDPAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::LANDPAGE_DISPATCH_TOKEN not set; skipping"; exit 0; fi
          gh api repos/Dr4wOne/dr4w-landpage/dispatches -f event_type=blog-published \
            -F "client_payload[sha]=$GITHUB_SHA"
