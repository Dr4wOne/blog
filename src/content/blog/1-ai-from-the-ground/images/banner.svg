<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching theme -->
  <rect width="1200" height="600" fill="#0A0A0F"/>
  
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="600" fill="url(#grad1)"/>
  
  <!-- Neural network nodes and connections (abstract representation) -->
  <!-- Left cluster of nodes -->
  <circle cx="150" cy="100" r="25" fill="#0066FF" opacity="0.8"/>
  <circle cx="100" cy="180" r="20" fill="#0066FF" opacity="0.6"/>
  <circle cx="180" cy="220" r="22" fill="#0066FF" opacity="0.7"/>
  <circle cx="140" cy="300" r="18" fill="#0066FF" opacity="0.5"/>
  
  <!-- Center cluster -->
  <circle cx="600" cy="150" r="30" fill="#00D9FF" opacity="0.9"/>
  <circle cx="550" cy="250" r="28" fill="#00D9FF" opacity="0.8"/>
  <circle cx="650" cy="300" r="25" fill="#00D9FF" opacity="0.7"/>
  <circle cx="600" cy="400" r="26" fill="#00D9FF" opacity="0.8"/>
  
  <!-- Right cluster -->
  <circle cx="1050" cy="120" r="24" fill="#0066FF" opacity="0.7"/>
  <circle cx="1100" cy="200" r="20" fill="#0066FF" opacity="0.6"/>
  <circle cx="1000" cy="280" r="22" fill="#0066FF" opacity="0.7"/>
  <circle cx="1080" cy="350" r="19" fill="#0066FF" opacity="0.5"/>
  
  <!-- Connections -->
  <line x1="150" y1="100" x2="600" y2="150" stroke="#0066FF" stroke-width="2" opacity="0.4"/>
  <line x1="100" y1="180" x2="550" y2="250" stroke="#0066FF" stroke-width="2" opacity="0.4"/>
  <line x1="180" y1="220" x2="650" y2="300" stroke="#0066FF" stroke-width="2" opacity="0.4"/>
  <line x1="140" y1="300" x2="600" y2="400" stroke="#0066FF" stroke-width="2" opacity="0.4"/>
  
  <line x1="600" y1="150" x2="1050" y2="120" stroke="#00D9FF" stroke-width="2" opacity="0.4"/>
  <line x1="550" y1="250" x2="1100" y2="200" stroke="#00D9FF" stroke-width="2" opacity="0.4"/>
  <line x1="650" y1="300" x2="1000" y2="280" stroke="#00D9FF" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="400" x2="1080" y2="350" stroke="#00D9FF" stroke-width="2" opacity="0.4"/>
  
  <!-- Title text -->
  <text x="600" y="520" font-size="56" font-weight="bold" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif">
    AI From the Ground Up
  </text>
  <text x="600" y="570" font-size="24" text-anchor="middle" fill="#A0A0A0" font-family="Arial, sans-serif">
    LLMs, Agents, Harnesses & Tooling
  </text>
</svg>
